<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="todo-container">
    <h1>Anthony To-Do List</h1>
    
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Hello, you are welcome">
        <button id="add-btn">Enter</button>
    </div>
    <div id="error-box" class="error-msg">This item already exists!</div>

    <ul id="todo-list">
    </ul>
</div>

<script>  let todos = JSON.parse(localStorage.getItem('my_unique_todos')) || [];

    const inputEl = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const listEl = document.getElementById('todo-list');
    const errorBox = document.getElementById('error-box');

    
    function saveAndRender() {
       
        localStorage.setItem('my_unique_todos', JSON.stringify(todos));
        render();
    }

    function addItem() {
        const text = inputEl.value.trim();
        
        // Prevent empty items
        if (!text) return;

        // Requirement: Prevent duplicates (Case-insensitive check)
        const isDuplicate = todos.some(item => 
            item.text.toLowerCase() === text.toLowerCase()
        );

        if (isDuplicate) {
            errorBox.style.display = 'block';
            return;
        }

        errorBox.style.display = 'none';
        
        const newTodo = {
            id: Date.now(), // Unique ID
            text: text,
            done: false
        };

        todos.push(newTodo);
        inputEl.value = '';
        saveAndRender();
    }

    function toggleDone(id) {
        todos = todos.map(todo => {
            if (todo.id === id) {
                return { ...todo, done: !todo.done };
            }
            return todo;
        });
        saveAndRender();
    }

    function deleteItem(id) {
        todos = todos.filter(todo => todo.id !== id);
        saveAndRender();
    }

    
    function render() {
        listEl.innerHTML = '';

        todos.forEach(todo => {
            const li = document.createElement('li');
            
            li.innerHTML = `
                <span class="todo-text ${todo.done ? 'done' : ''}" 
                      onclick="toggleDone(${todo.id})">
                    ${escapeHTML(todo.text)}
                </span>
                <div class="actions">
                    <button class="btn-action complete-btn" onclick="toggleDone(${todo.id})">
                        ${todo.done ? 'Undo' : 'Done'}
                    </button>
                    <button class="btn-action delete-btn" onclick="deleteItem(${todo.id})">
                        Delete
                    </button>
                </div>
            `;
            listEl.appendChild(li);
        });
    }
    // Helper to prevent XSS (Always escape user input)
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    
    addBtn.addEventListener('click', addItem);

    // Support "Enter" key
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addItem();
    });

    // Hide error while typing
    inputEl.addEventListener('input', () => {
        errorBox.style.display = 'none';
    });
    render(); 
</script>

</body>
</html>
